name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Install Worker dependencies
        working-directory: gbcphy-r2-worker
        run: bun install

      - name: Worker typecheck
        working-directory: gbcphy-r2-worker
        run: bun run typecheck

      - name: Worker tests
        working-directory: gbcphy-r2-worker
        run: bun run test

      - name: Worker dry-run build
        working-directory: gbcphy-r2-worker
        run: bunx wrangler deploy --dry-run
