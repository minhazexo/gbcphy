[bun-version]
# Lock the runtime to the installed Bun version for reproducible installs
version = "1.4.3"

[install]
# Use Bun's default registry with automatic fallback for missing native bins.
auto = "fallback"
# Allow postinstall scripts (react-scripts/sass need them on fresh clones).
exact = false

[run]
# Keep dev/build output visible; Bun shells these out to the Node toolchain.
silent = false

[test]
# Bun's test runner is Jest-compatible; run source files under src/.
include = ["src/**/*.test.{js,jsx}"]
timeout = 30000
